<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>LOCALL</title>
    <link rel="stylesheet" href="/css/style.css?v=alpha-pieces-5" />
    <link id="favicon" rel="icon" href="/images/locall-favicon.png" />
  </head>
  <body>
    <!-- Tela de login / cadastro -->
    <div id="login-overlay">
      <div id="login-loading" class="login-loading hidden">Reconectando…</div>

      <form id="login-form" class="login-card" autocomplete="off">
        <h1>🎙️ LOCALL</h1>
        <p class="login-sub">Entre para conversar na rede local.</p>

        <div id="auth-tabs" class="auth-tabs">
          <button type="button" id="tab-login" class="auth-tab active">Entrar</button>
          <button type="button" id="tab-register" class="auth-tab">Criar conta</button>
        </div>

        <!-- Campos exclusivos do cadastro -->
        <div id="register-only" class="register-only hidden">
          <div id="login-avatar-preview" class="avatar avatar-lg">😎</div>
          <label class="avatar-upload">
            Escolher avatar (opcional)
            <input id="login-avatar" type="file" accept="image/*" hidden />
          </label>
          <input id="field-name" type="text" maxlength="32" placeholder="Seu nome" autocomplete="off" />
        </div>

        <input id="field-email" type="email" maxlength="254" placeholder="E-mail" autocomplete="username" required />
        <input id="field-password" type="password" minlength="6" placeholder="Senha" autocomplete="current-password" required />

        <button id="login-submit" type="submit">Entrar</button>
        <div id="login-error" class="login-error"></div>
      </form>
    </div>

    <!-- Aplicação (3 colunas) -->
    <div id="app" class="hidden">
      <!-- Coluna 1: canais + painel do usuário -->
      <aside id="sidebar">
        <header class="sidebar-header"><img id="server-logo" class="server-logo" src="/images/locall-logo.png" alt="locall" /></header>
        <div id="channel-list"></div>

        <div id="self-panel">
          <div id="voice-status" class="voice-status hidden">
            <div class="voice-status-head">
              <div class="voice-status-info">
                <span class="voice-status-title"><svg class="inline-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" x2="12.01" y1="20" y2="20"/></svg> Voz conectada</span>
                <span class="voice-status-name"></span>
              </div>
              <div class="voice-status-actions">
                <span id="call-timer" class="call-timer"></span>
                <button id="btn-leave" class="icon-btn danger" title="Sair do canal de voz"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"/><line x1="22" x2="2" y1="2" y2="22"/></svg></button>
              </div>
            </div>
            <div class="voice-actions">
              <button id="btn-cam" class="action-btn" title="Ligar/desligar câmera"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 8-6 4 6 4V8Z"/><rect x="2" y="6" width="14" height="12" rx="2" ry="2"/></svg></button>
              <button id="btn-screen" class="action-btn" title="Compartilhar tela"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg></button>
              <button id="btn-soundboard" class="action-btn" title="Soundboard"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></button>
            </div>
          </div>
          <div class="self-row">
            <div class="self-user">
              <div id="self-avatar" class="avatar avatar-sm"></div>
              <div class="self-user-text">
                <span id="self-name" class="self-name"></span>
                <span class="self-substatus">Online</span>
              </div>
            </div>
            <div class="self-controls">
              <button id="btn-mute" class="icon-btn" title="Mutar/desmutar microfone"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg></button>
              <button id="btn-deaf" class="icon-btn" title="Ensurdecer"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-5a9 9 0 0 1 18 0v5a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/></svg></button>
              <button id="btn-settings" class="icon-btn" title="Configurar áudio (microfone e saída)"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2Z"/><circle cx="12" cy="12" r="3"/></svg></button>
            </div>
          </div>
        </div>
      </aside>

      <!-- Coluna 2: chat -->
      <main id="chat">
        <header id="chat-header">
          <span id="chat-title"></span>
          <button id="btn-view-toggle" class="btn-view-toggle hidden" title="Alternar vídeo/chat"></button>
        </header>
        <div id="video-stage" class="video-stage hidden"></div>
        <div id="messages"></div>

        <div id="reply-banner" class="reply-banner hidden">
          <span class="reply-target"></span>
          <button id="reply-cancel" class="icon-btn" title="Cancelar resposta"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
        </div>

        <form id="composer" class="composer" autocomplete="off">
          <div id="attach-chip" class="attach-chip hidden">
            <img id="attach-thumb" class="attach-thumb hidden" alt="" />
            <span class="attach-name"></span>
            <button id="attach-remove" type="button" class="icon-btn" title="Remover anexo"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
          </div>
          <div class="composer-row">
            <button id="attach-btn" type="button" class="icon-btn" title="Adicionar"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
            <input id="attach-input" type="file" hidden />
            <textarea id="composer-input" rows="1" placeholder="Mensagem"></textarea>
            <button type="submit" class="icon-btn send" title="Enviar"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4Z"/></svg></button>
          </div>
        </form>
      </main>

      <!-- Coluna 3: usuários -->
      <aside id="members"></aside>
    </div>

    <!-- Elementos <audio> dos participantes de voz ficam aqui (ocultos) -->
    <div id="audio-sink" aria-hidden="true"></div>

    <!-- Overlay de arrastar-e-soltar arquivo -->
    <div id="drop-overlay" class="drop-overlay hidden">
      <div class="drop-box">
        <svg class="drop-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
        <span>Solte o arquivo para anexar</span>
      </div>
    </div>

    <!-- Overlay em tela cheia para assistir à tela compartilhada de alguém -->
    <div id="screen-overlay" class="screen-overlay hidden">
      <div class="screen-overlay-head">
        <span id="screen-overlay-title" class="screen-overlay-title"></span>
        <button id="screen-overlay-close" class="icon-btn" title="Fechar"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
      </div>
      <video id="screen-video" class="screen-video" autoplay playsinline></video>
    </div>

    <!-- Lista flutuante de telas disponíveis para assistir no canal atual -->
    <div id="screen-list" class="screen-list hidden"></div>

    <!-- Aviso: navegador bloqueou o autoplay do áudio remoto -->
    <button id="audio-unblock" class="audio-unblock hidden">
      <svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
      Clique para ativar o áudio
    </button>

    <!-- Modal de configurações de áudio -->
    <div id="settings-overlay" class="modal-overlay hidden">
      <div class="modal-card" role="dialog" aria-modal="true" aria-label="Configurações">
        <div class="modal-head">
          <h2>Configurações</h2>
          <button id="settings-close" class="icon-btn" title="Fechar"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
        </div>

        <div class="settings-field">
          <span><svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> Perfil</span>
          <div class="profile-edit-row">
            <div id="profile-avatar-preview" class="avatar avatar-lg"></div>
            <label class="avatar-upload">
              Alterar foto
              <input id="profile-avatar-input" type="file" accept="image/*" hidden />
            </label>
          </div>
          <div class="name-edit-row">
            <input id="profile-name" type="text" maxlength="32" placeholder="Seu nome" />
            <button id="profile-save" type="button" class="btn-secondary">Salvar</button>
          </div>
          <div id="profile-hint" class="settings-hint"></div>
        </div>

        <label class="settings-field">
          <span><svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg> Microfone</span>
          <select id="sel-mic"></select>
        </label>

        <label class="settings-field">
          <span><svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 8-6 4 6 4V8Z"/><rect x="2" y="6" width="14" height="12" rx="2" ry="2"/></svg> Câmera</span>
          <select id="sel-cam"></select>
        </label>

        <label class="settings-field" id="settings-out-row">
          <span><svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg> Saída de áudio</span>
          <select id="sel-out"></select>
        </label>

        <div class="settings-field">
          <span><svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg> Teste de microfone</span>
          <div class="mic-test-row">
            <button id="mic-test-btn" type="button" class="btn-secondary">Testar</button>
            <div class="mic-meter"><div id="mic-meter-fill" class="mic-meter-fill"></div></div>
          </div>
          <label class="mic-monitor">
            <input type="checkbox" id="mic-monitor" checked />
            <svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-5a9 9 0 0 1 18 0v5a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/></svg> Ouvir minha voz (use fones para evitar microfonia)
          </label>
        </div>

        <div id="settings-hint" class="settings-hint"></div>

        <button id="btn-logout" type="button" class="btn-logout">Sair da conta</button>
      </div>
    </div>

    <!-- Modal de jogos -->
    <div id="games-overlay" class="modal-overlay hidden">
      <div class="modal-card" role="dialog" aria-modal="true" aria-label="Jogos">
        <div class="modal-head">
          <h2 id="games-title">Jogos</h2>
          <button id="games-close" class="icon-btn" title="Fechar"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
        </div>

        <!-- Lista de jogos -->
        <div id="games-grid" class="games-grid">
          <button id="game-tile-chess" type="button" class="game-tile">
            <span class="game-tile-icon">♞</span>
            <span class="game-tile-name">Xadrez</span>
          </button>
        </div>

        <!-- Escolha de modo (após clicar num jogo) -->
        <div id="games-mode" class="games-mode hidden">
          <button id="mode-bot" type="button" class="mode-option">
            <span class="mode-option-title">Contra o bot</span>
            <span class="mode-option-sub">Jogue sozinho contra o computador (Stockfish)</span>
          </button>
          <button id="mode-online" type="button" class="mode-option">
            <span class="mode-option-title">Multiplayer</span>
            <span class="mode-option-sub">Jogue contra alguém conectado no servidor</span>
          </button>
          <button id="mode-back" type="button" class="btn-secondary">Voltar</button>
        </div>
      </div>
    </div>

    <!-- Overlay do jogo de xadrez -->
    <div id="chess-overlay" class="modal-overlay hidden">
      <div class="modal-card chess-card" role="dialog" aria-modal="true" aria-label="Xadrez">
        <div class="modal-head">
          <h2>Xadrez</h2>
          <button id="chess-close" class="icon-btn" title="Fechar"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
        </div>

        <div class="chess-status-row">
          <span id="chess-status" class="chess-status"></span>
          <button id="chess-new" type="button" class="btn-secondary">Novo jogo</button>
          <button id="chess-resign" type="button" class="btn-secondary hidden">Desistir</button>
        </div>

        <div class="chess-layout">
          <div id="chess-board" class="chess-board"></div>

          <div class="chess-themes">
            <div class="theme-group">
              <h3>Tabuleiro</h3>
              <div id="board-theme-list" class="theme-swatch-list"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal do soundboard -->
    <div id="soundboard-overlay" class="modal-overlay hidden">
      <div class="modal-card" role="dialog" aria-modal="true" aria-label="Soundboard">
        <div class="modal-head">
          <h2>Soundboard</h2>
          <button id="soundboard-close" class="icon-btn" title="Fechar"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
        </div>

        <div class="soundboard-toolbar">
          <button id="soundboard-stop" type="button" class="btn-secondary hidden"><svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"/></svg> Parar</button>
          <button id="soundboard-add-toggle" type="button" class="btn-secondary"><svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg> Adicionar som</button>
        </div>

        <div id="soundboard-grid" class="soundboard-grid"></div>

        <form id="soundboard-form" class="soundboard-form hidden" autocomplete="off">
          <input id="sound-name" type="text" maxlength="48" placeholder="Nome do som — pode usar emoji 🙂 (obrigatório)" />

          <div class="soundboard-file-row">
            <label class="avatar-upload">Escolher áudio<input id="sound-audio" type="file" accept="audio/*" hidden /></label>
          </div>

          <div id="sound-trimmer" class="sound-trimmer hidden">
            <canvas id="sound-waveform" class="sound-waveform"></canvas>
            <div class="sound-trim-controls">
              <button id="sound-preview" type="button" class="btn-secondary"><svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"/></svg> Ouvir trecho</button>
              <span id="sound-range" class="settings-hint"></span>
            </div>
          </div>

          <div class="soundboard-form-actions">
            <button id="sound-submit" type="submit" class="btn-secondary">Enviar som</button>
            <button id="sound-cancel" type="button" class="btn-secondary">Cancelar</button>
          </div>
          <div id="soundboard-hint" class="settings-hint"></div>
        </form>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/app.bundle.js?v=alpha-pieces-5"></script>
  </body>
</html>
